version: '3.8'
services:
   api:
      build: .
      ports:
         - '8181:8181'
      env_file: .env
      environment:
         DB_URL: mongodb://mongo:27017/node_boilerplate
      depends_on:
         - mongo
   mongo:
      image: mongo:7
      ports:
         - '27017:27017'
      volumes:
         - mongo-data:/data/db
volumes:
   mongo-data:
